name: Site checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          bundler-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:js
      - name: Verify committed bundle is reproducible
        run: git diff --exit-code -- assets/js/main.min.js
      - name: Build production site
        env:
          JEKYLL_ENV: production
          BUNDLE_FROZEN: 'true'
        run: bundle exec jekyll build --strict_front_matter
      - name: Test site regression checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Check links, metadata and sitemap
        run: python3 scripts/check_site.py _site
      - name: Check external links (weekly or on demand)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --max-retries 2 --timeout 20 --exclude '^https://fair-bioheaders.github.io' '_site/**/*.html'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-preview
          path: _site
