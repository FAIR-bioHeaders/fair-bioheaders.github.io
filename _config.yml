# FAIR BioHeaders project site. Theme origin and maintenance policy: docs/maintenance.md.
locale: en-US
title: FAIR BioHeaders
title_separator: "-"
name: FAIR BioHeaders
description: "FAIR BioHeaders keeps reference genome metadata and provenance close to sequence data, supporting discovery, interoperability, and reuse."
url: https://fair-bioheaders.github.io
baseurl: ""
repository: FAIR-bioHeaders/fair-bioheaders.github.io
timezone: Etc/UTC

author:
  avatar: logo.png
  name: FAIR BioHeaders
  bio: "Metadata and provenance for reference genomes."
  github: FAIR-bioHeaders

social:
  type: Organization
  name: FAIR BioHeaders
  links:
    - https://github.com/FAIR-bioHeaders
    - https://zenodo.org/communities/fh-/
keywords: "FAIR, TRUST, reference genome, metadata, provenance, bioinformatics, FASTA, GFA, YAML, JSON"
knowsAbout:
  - FAIR data principles
  - TRUST principles
  - reference genome metadata
  - data provenance
  - genomics interoperability
og_image: logo.png
analytics:
  provider: false
comments:
  provider: false
atom_feed:
  hide: false
  path: /feed.xml
feed:
  collections:
    publications:
      path: /publications/feed.xml
future: false
read_more: disabled
breadcrumbs: false
words_per_minute: 160

include:
  - _pages
exclude:
  - .bundle
  - .sass-cache
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CONTRIBUTING.md
  - docs
  - scripts
  - package.json
  - package-lock.json
  - node_modules
  - vendor
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
encoding: utf-8
markdown: kramdown
highlighter: rouge
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  syntax_highlighter: rouge

collections:
  publications:
    output: true
    permalink: /:collection/:path/
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: publications
    values:
      layout: single
      author_profile: true
      share: false
      comments: false
sass:
  sass_dir: _sass
  style: compressed
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
compress_html:
  clippings: all
  ignore:
    envs: development
