# Bibliography records in a BibTeX-shaped schema. Each entry maps to Schema.org
# microdata rendered by _includes/reference.html; assets/js/cite.js turns the
# rendered microdata back into a BibTeX entry for the per-reference "Cite" button.
#
# Fields:
#   type      BibTeX entry type: article, software, dataset, misc
#   title     Entry title
#   authors   List of {family, given}
#   journal   Container title (journal / periodical / book)
#   publisher Publisher or hosting organization
#   year      Publication year (datePublished)
#   volume    Volume number
#   number    Issue / number
#   pages     Page range ("150-165") or article number
#   doi       DOI without the https://doi.org/ prefix
#   url       Canonical URL (defaults to the DOI resolver)

