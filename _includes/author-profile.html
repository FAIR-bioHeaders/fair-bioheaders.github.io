{% include base_path %}
<div class="h-card" itemscope itemtype="https://schema.org/Organization">
  <div class="author__avatar">
    <img src="{{ base_path }}/images/{{ site.author.avatar }}" class="author__avatar u-logo" alt="FAIR BioHeaders logo" width="800" height="800">
  </div>
  <div class="author__content">
    <h3 class="author__name p-name" itemprop="name">{{ site.author.name }}</h3>
    <p class="author__bio">{{ site.author.bio }}</p>
  </div>
  <ul class="project-links">
    <li><a class="u-url" href="https://github.com/{{ site.author.github }}" itemprop="sameAs">GitHub organization</a></li>
    <li><a href="{{ base_path }}/resources/">Documentation & citation</a></li>
  </ul>
</div>
